<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sub-X OS — Alg Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="alg-trainer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { overflow: auto; height: auto; min-height: 100vh; }
    #trainer-page {
      max-width: 860px;
      margin: 0 auto;
      padding: 12px 16px 40px;
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .tp-topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .tp-logo {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-decoration: none;
    }
    .tp-sep { flex: 1; }
    .tp-back {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 3px;
      text-decoration: none;
      color: var(--text2);
      border: 1px solid var(--border);
      background: var(--bg2);
      cursor: pointer;
      transition: border-color 0.1s, color 0.1s;
    }
    .tp-back:hover { border-color: var(--accent); color: var(--accent); }
    /* Override trainer content to fill page */
    #trainer-panel { display: flex; flex-direction: column; min-height: 80vh; }
    #trainer-content { flex: 1; overflow-y: visible; padding: 0; }
  </style>
</head>
<body>
<div id="trainer-page">
  <div class="tp-topbar">
    <a href="index.html" class="tp-logo">← Sub-X OS</a>
    <span class="tp-sep"></span>
    <span style="font-size:11px;color:var(--text3)" id="tp-theme-label">Algorithm Trainer</span>
    <select id="tp-theme" onchange="applyTheme(this.value)"
            style="font-size:10px;padding:2px 5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:3px">
      <option value="dark">Dark</option>
      <option value="light">Light</option>
      <option value="amoled">AMOLED</option>
      <option value="green">Green</option>
    </select>
  </div>

  <div id="trainer-panel">
    <div id="trainer-content">Loading...</div>
  </div>
</div>

<!-- Load only what trainer needs -->
<script src="utils.js"></script>
<script src="storage.js"></script>
<script src="alg-data.js"></script>
<script src="alg-trainer.js"></script>

<script>
  // Apply saved theme
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    localStorage.setItem('subx_trainer_theme', t);
    const sel = document.getElementById('tp-theme');
    if (sel) sel.value = t;
  }
  const saved = localStorage.getItem('subx_trainer_theme')
    || localStorage.getItem('subx_settings') && JSON.parse(localStorage.getItem('subx_settings'))?.theme
    || 'dark';
  applyTheme(saved);

  document.addEventListener('DOMContentLoaded', () => {
    AlgTrainer.init();
  });
</script>
</body>
</html>
