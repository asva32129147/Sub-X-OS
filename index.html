<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" id="theme-color-meta" content="#1a1a1a">
  <title>Sub-X OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600&family=Rubik:wght@300;400;600&family=Outfit:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <!-- Sub-X overrides (timer display, solve list, accent colour only) -->
  <link rel="stylesheet" href="subx.css?v=23">
  <link rel="stylesheet" href="alg-trainer.css?v=23">

  <!-- cubing.js 3D renders -->
  <script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module" defer></script>
</head>
<body class="overflow-hidden" style="height:100dvh">
<div id="timer-state" data-state="idle" aria-hidden="true" style="display:none"></div>

<!-- ══ APP SHELL ═══════════════════════════════════════════════════════════ -->
<div id="app" class="d-flex" style="height:100dvh;overflow:hidden">

  <!-- ── SIDEBAR (desktop) ──────────────────────────────────────────────── -->
  <nav id="sidebar" class="d-none d-md-flex flex-column border-end p-2 gap-1"
       style="width:160px;min-width:160px;overflow-y:auto" aria-label="Navigation">

    <div class="sb-logo fw-bold text-accent mb-1">Sub-X OS<span id="sync-indicator"></span></div>

    <small class="text-secondary text-uppercase" style="letter-spacing:.08em;font-size:9px">Event</small>
    <select id="event-selector" class="form-select form-select-sm mb-1" aria-label="Event"></select>

    <small class="text-secondary text-uppercase" style="letter-spacing:.08em;font-size:9px">Session</small>
    <select id="session-selector" class="form-select form-select-sm" aria-label="Session"></select>
    <div class="d-flex gap-1 mb-1">
      <button id="btn-new-session"    class="btn btn-sm btn-outline-secondary flex-fill" title="New session">+New</button>
      <button id="btn-rename-session" class="btn btn-sm btn-outline-secondary" title="Rename">✎</button>
      <button id="btn-delete-session" class="btn btn-sm btn-outline-danger"    title="Delete">✕</button>
    </div>

    <small class="text-secondary text-uppercase" style="letter-spacing:.08em;font-size:9px">View</small>
    <button class="btn btn-sm btn-outline-info active w-100 text-start mb-0"
            data-view="timer" onclick="showView('timer',this)">Timer</button>
    <button class="btn btn-sm btn-outline-secondary w-100 text-start mb-2"
            data-view="trainer" onclick="showView('trainer',this)">Alg Trainer</button>

    <!-- Bottom controls -->
    <div class="mt-auto d-flex flex-column gap-1">
      <button id="btn-inspection-toggle" class="btn btn-sm btn-outline-info insp-on"
              onclick="Timer.toggleInspection()">INSP: ON</button>
      <button class="btn btn-sm btn-outline-secondary w-100" onclick="App.nextScramble()">New Scramble</button>
      <button class="btn btn-sm btn-outline-secondary w-100" onclick="SessionManager.open()">Sessions</button>
      <button class="btn btn-sm btn-outline-secondary w-100" onclick="UniversalImport.open()">Import Data</button>
      <button class="btn btn-sm btn-outline-secondary w-100" onclick="showView('timeattack',this)">Time Attack</button>
      <button class="btn btn-sm btn-outline-secondary w-100" id="btn-account" onclick="AuthUI.open()">Sign In</button>
      <button class="btn btn-sm btn-outline-secondary w-100" id="btn-settings" onclick="Settings.open()">Settings</button>
    </div>
  </nav>

  <!-- ── MAIN AREA ──────────────────────────────────────────────────────── -->
  <main id="main-area" class="flex-grow-1 d-flex flex-column overflow-hidden" role="main">

    <!-- Mobile top bar -->
    <header id="mobile-bar" class="d-flex d-md-none align-items-center gap-2 px-2 py-1 border-bottom">
      <button class="btn btn-sm btn-outline-secondary" onclick="openDrawer()" aria-label="Menu">☰</button>
      <span class="fw-bold text-accent">Sub-X OS</span>
      <select id="event-sel-mob" class="form-select form-select-sm flex-grow-1"
              onchange="syncEventFromMob(this)"></select>
      <button id="insp-btn-mob" class="btn btn-sm btn-outline-info insp-on"
              onclick="Timer.toggleInspection();syncInspBtns()">INSP</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="Settings.open()">⚙</button>
    </header>

    <!-- TIMER VIEW -->
    <div id="view-timer" class="view active">
      <!-- Scramble -->
      <div id="scramble-wrap" class="px-3 pt-2 pb-1 text-center border-bottom">
        <div id="scramble-event-label" class="text-info fw-bold" style="display:none;letter-spacing:.1em"></div>
        <div id="scramble-display" class="scramble-text" aria-live="polite">Generating...</div>
        <div class="d-flex justify-content-center align-items-center gap-2 mt-1">
          <div id="scramble-view-btns" class="d-flex gap-1">
            <button class="btn btn-sm btn-outline-secondary scr-view-btn" id="btn-draw-scr"
                    onclick="ScrambleDraw.toggle()">▨ Draw</button>
            <button class="btn btn-sm btn-outline-secondary scr-view-btn" id="btn-3d-scr"
                    onclick="ScrambleDraw.toggle3D()">● 3D</button>
          </div>
          <button class="btn btn-sm btn-outline-secondary" onclick="App.nextScramble()">↺</button>
        </div>
      </div>

      <!-- Draw scramble panel — empty container: scramble-draw.js creates and
           destroys the twisty-player element dynamically rather than mutating
           attributes on a persistent one, since toggling between 2D (SVG) and
           3D (WebGL) rendering modes on the same instance is unreliable. -->
      <div id="scramble-draw-panel" class="justify-content-center py-2 border-bottom">
        <div id="scramble-twisty-container" style="width:100%;max-width:340px;height:200px;margin:0 auto"></div>
      </div>

      <!-- Smart cube bar -->
      <div id="sc-status-bar" class="align-items-center justify-content-between px-3 py-1 border-bottom small">
        <span id="sc-status-bar-text" class="text-secondary">Smart Cube not connected</span>
        <button class="btn btn-sm btn-outline-info"
                onclick="document.getElementById('smartcube-overlay').classList.toggle('open')">Connect</button>
      </div>

      <!-- PB flash -->
      <div id="pb-flash" role="status" aria-live="polite"></div>

      <!-- Timer centre -->
      <div id="timer-area" class="flex-grow-1 d-flex flex-column align-items-center justify-content-center"
           role="button" aria-label="Timer">
        <div id="timer-display" data-state="idle" aria-live="off">0.00</div>
        <div id="inspection-display" class="text-warning fs-3 fw-bold mt-2" aria-live="assertive"></div>
      </div>

      <!-- Virtual cube panel -->
      <div id="vc-wrap" class="border-top px-3 py-2" style="display:none">
        <div id="vc-header" class="d-flex align-items-center gap-2 mb-2">
          <span id="vc-last-move" class="vc-last-move text-info fs-4 fw-bold"></span>
          <span id="vc-solved" class="badge bg-success" style="display:none">SOLVED!</span>
          <small class="text-secondary ms-auto">U F R L D B (+ ' or 2)</small>
        </div>
        <div id="vc-faces"></div>
      </div>

      <!-- Timer hint -->
      <div id="timer-hint" class="text-center text-secondary small py-2 border-top" aria-hidden="true">
        Hold <kbd>Space</kbd> to start · <kbd>Esc</kbd> cancel
      </div>
      <div id="stat-detail-overlay" role="dialog" aria-hidden="true"></div>
    </div>

    <!-- TRAINER VIEW -->
    <div id="view-trainer" class="view">
      <div id="trainer-panel" class="h-100 overflow-y-auto">
        <div id="trainer-content" class="p-3"></div>
      </div>
    </div>

    <!-- TIME ATTACK VIEW -->
    <div id="view-timeattack" class="view">
      <div id="time-attack-panel" class="h-100 overflow-y-auto">
        <div id="ta-content" class="p-3"></div>
      </div>
    </div>

  </main>

  <!-- ── RIGHT PANEL ────────────────────────────────────────────────────── -->
  <aside id="side" class="d-none d-md-flex flex-column border-start overflow-hidden"
         style="width:220px;min-width:220px" aria-label="Statistics">
    <div id="stats-panel" class="px-2 pt-2"></div>
    <div id="solve-panel" class="flex-grow-1 d-flex flex-column overflow-hidden border-top mt-1">
      <div class="d-flex align-items-center justify-content-between px-2 py-1">
        <small class="text-secondary text-uppercase" style="font-size:9px;letter-spacing:.08em">Solves</small>
        <button class="btn btn-sm btn-outline-secondary py-0" style="font-size:10px"
                onclick="Sessions.exportCSTimer()">Export</button>
      </div>
      <div id="solve-list" class="overflow-y-auto flex-grow-1" role="list"></div>
    </div>
    <div id="session-controls" class="d-flex gap-1 p-2 border-top">
      <button class="btn btn-sm btn-outline-secondary flex-fill"
              onclick="document.getElementById('btn-new-session').click()">New</button>
      <button class="btn btn-sm btn-outline-secondary flex-fill"
              onclick="document.getElementById('btn-rename-session').click()">Rename</button>
      <button class="btn btn-sm btn-outline-danger flex-fill"
              onclick="document.getElementById('btn-delete-session').click()">Delete</button>
    </div>
  </aside>

</div><!-- /app -->

<!-- ══ MOBILE DRAWER ═══════════════════════════════════════════════════════ -->
<div id="drawer-overlay" onclick="closeDrawer()" aria-hidden="true" class="d-md-none"></div>
<div id="mobile-drawer" class="d-md-none" role="navigation" aria-label="Mobile navigation">
  <div class="fw-bold text-accent p-2 border-bottom">Sub-X OS</div>
  <div class="p-2 d-flex flex-column gap-1">
    <small class="text-secondary">Event</small>
    <select id="event-sel-drawer" class="form-select form-select-sm"
            onchange="syncEventFromDrawer(this)"></select>
    <small class="text-secondary mt-1">Session</small>
    <select id="sess-sel-drawer" class="form-select form-select-sm"
            onchange="Storage.setCurrentSession(this.value);App.onSessionSwitch();closeDrawer()"></select>
    <div class="d-flex gap-1">
      <button onclick="document.getElementById('btn-new-session').click();closeDrawer()"
              class="btn btn-sm btn-outline-secondary flex-fill">+New</button>
      <button onclick="document.getElementById('btn-rename-session').click();closeDrawer()"
              class="btn btn-sm btn-outline-secondary">✎</button>
      <button onclick="document.getElementById('btn-delete-session').click();closeDrawer()"
              class="btn btn-sm btn-outline-danger">✕</button>
    </div>
    <hr class="my-1">
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="showView('timer',null);closeDrawer()">Timer</button>
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="showView('trainer',null);closeDrawer()">Alg Trainer</button>
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="SessionManager.open();closeDrawer()">Sessions</button>
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="UniversalImport.open();closeDrawer()">Import Data</button>
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="showView('timeattack',null);closeDrawer()">Time Attack</button>
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="Timer.toggleInspection();syncInspBtns();closeDrawer()">Toggle Inspection</button>
    <button class="btn btn-sm btn-outline-secondary text-start" onclick="Settings.open();closeDrawer()">Settings</button>
  </div>
</div>

<!-- ══ BOOTSTRAP MODALS ════════════════════════════════════════════════════ -->

<!-- Settings -->
<div id="settings-overlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box"><div class="modal-header"><h2>Settings</h2>
    <button id="settings-close" aria-label="Close">✕</button></div>
  <div id="settings-content"></div></div>
</div>

<!-- Solve Summary -->
<div id="solve-summary-overlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box" style="max-width:520px"><div class="modal-header"><h2>Solve Detail</h2>
    <button onclick="SolveSummary.close()" aria-label="Close">✕</button></div>
  <div id="solve-summary-content"></div></div>
</div>
<div id="ss-toast" class="ss-toast" aria-live="polite"></div>

<!-- Smart Cube -->
<div id="smartcube-overlay" class="modal-overlay" role="dialog">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-header"><h2>Smart Cube</h2>
      <button onclick="document.getElementById('smartcube-overlay').classList.remove('open')" aria-label="Close">✕</button>
    </div>
    <div id="smartcube-panel" class="p-2">
      <div id="smartcube-status" data-state="idle" class="sc-status mb-2">No cube connected</div>
      <div class="d-flex gap-2 mb-2">
        <button id="btn-smartcube-connect" class="btn btn-success btn-sm" onclick="SmartCube.connect()">Connect Cube</button>
        <button id="btn-smartcube-disconnect" class="btn btn-outline-secondary btn-sm" style="display:none" onclick="SmartCube.disconnect()">Disconnect</button>
        <button id="btn-gyro-toggle" class="btn btn-outline-secondary btn-sm" onclick="Gyro.toggle()">Gyro</button>
        <button id="btn-gyro-reset" class="btn btn-outline-secondary btn-sm" onclick="Gyro.reset()">Reset</button>
      </div>
      <div id="gyro-panel" style="display:none">
        <div class="small text-secondary mb-1">Gyro Orientation</div>
        <div id="gyro-cube-wrap"><div id="gyro-cube">
          <div class="gc-face gc-front">F</div><div class="gc-face gc-back">B</div>
          <div class="gc-face gc-left">L</div><div class="gc-face gc-right">R</div>
          <div class="gc-face gc-top">U</div><div class="gc-face gc-bottom">D</div>
        </div></div>
        <div class="sc-gyro-vals" id="gyro-vals">α:— β:— γ:—</div>
        <div id="gyro-mode-label" class="text-secondary text-center" style="font-size:9px">Not active</div>
        <div id="gyro-cal-bar" class="mt-2"><div id="gyro-cal-thumb"></div></div>
      </div>
      <div id="sc-tps" class="sc-tps mt-2"></div>
      <div class="sc-section-label" id="sc-move-label" style="display:none">Live Moves</div>
      <div id="smartcube-moves" class="sc-moves mt-1"></div>
    </div>
  </div>
</div>

<!-- ══ MOBILE BOTTOM TABS ══════════════════════════════════════════════════ -->
<div id="mobile-tabs" class="d-flex d-md-none border-top" role="tablist">
  <button class="mob-tab active flex-fill" role="tab" onclick="mobileTab('timer',this)">Timer</button>
  <button class="mob-tab flex-fill" role="tab" onclick="mobileTab('stats',this)">Solves</button>
  <button class="mob-tab flex-fill" role="tab" onclick="mobileTab('trainer',this)">Trainer</button>
  <button class="mob-tab flex-fill" role="tab" onclick="mobileTab('timeattack',this)">Attack</button>
  <button class="mob-tab flex-fill" role="tab" onclick="Settings.open()">Settings</button>
</div>

<input type="file" id="import-file-input" accept=".txt,.json" aria-hidden="true"
       style="display:none" onchange="Sessions.importCSTimer(this.files[0])">

<!-- ══ SCRIPTS (order is critical) ════════════════════════════════════════ -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
<script src="utils.js?v=23"></script>
<script src="storage.js?v=23"></script>
<script src="scramble.js?v=23"></script>
<script src="timer.js?v=23"></script>
<script src="sessions.js?v=23"></script>
<script src="stats.js?v=23"></script>
<script src="settings.js?v=23"></script>
<script src="alg-data.js?v=23"></script>
<script src="alg-trainer.js?v=23"></script>
<script src="solve-summary.js?v=23"></script>
<script src="smartcube.js?v=23"></script>
<script src="gyro.js?v=23"></script>
<script src="session-manager.js?v=23"></script>
<script src="universal-import.js?v=23"></script>
<script src="time-attack.js?v=23"></script>
<script src="virtual-cube.js?v=23"></script>
<script src="scramble-draw.js?v=23"></script>
<script src="stackmat.js?v=23"></script>
<script src="cloud-sync.js?v=23"></script>
<script src="auth-ui.js?v=23"></script>
<script src="app.js?v=23"></script>

<script>
/* ── showView, mobileTab, drawer, scramble key ─────────────────────────── */
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(function(v) {
    v.classList.remove('active');
  });
  var el = document.getElementById('view-' + name);
  if (el) el.classList.add('active');

  document.querySelectorAll('[data-view]').forEach(function(b) {
    var active = b.dataset.view === name;
    b.classList.toggle('btn-outline-info', active);
    b.classList.toggle('btn-outline-secondary', !active);
  });

  if (name === 'trainer')    { if (typeof AlgTrainer !== 'undefined') AlgTrainer.show(); if (typeof Timer !== 'undefined') Timer.cancelAll(); }
  else                       { if (typeof AlgTrainer !== 'undefined') AlgTrainer.hide(); }
  if (name === 'timeattack') { if (typeof TimeAttack !== 'undefined') TimeAttack.show(); if (typeof Timer !== 'undefined') Timer.cancelAll(); }
}

function mobileTab(tab, btn) {
  document.querySelectorAll('.mob-tab').forEach(function(b) { b.classList.remove('active'); });
  if (btn) btn.classList.add('active');
  var side = document.getElementById('side');
  if (tab === 'stats') {
    var wasOpen = side && side.classList.contains('open');
    showView('timer', null);
    if (side) side.classList.toggle('open', !wasOpen);
    if (!wasOpen) setTimeout(function() { var sl = document.getElementById('solve-list'); if (sl) sl.scrollTop = 0; }, 50);
  } else {
    if (side) side.classList.remove('open');
    showView(tab, null);
  }
}
document.addEventListener('click', function(e) {
  var side = document.getElementById('side');
  if (!side || !side.classList.contains('open')) return;
  if (!side.contains(e.target) && !e.target.closest('.mob-tab')) side.classList.remove('open');
});

function openDrawer() {
  document.getElementById('mobile-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  var evD = document.getElementById('event-sel-drawer');
  var seD = document.getElementById('sess-sel-drawer');
  var evS = document.getElementById('event-selector');
  var seS = document.getElementById('session-selector');
  if (evD && evS) evD.innerHTML = evS.innerHTML, evD.value = evS.value;
  if (seD && seS) seD.innerHTML = seS.innerHTML, seD.value = seS.value;
}
function closeDrawer() {
  document.getElementById('mobile-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}
function syncEventFromMob(sel) { var ev = document.getElementById('event-selector'); if (ev) { ev.value = sel.value; ev.dispatchEvent(new Event('change')); } }
function syncEventFromDrawer(sel) { var ev = document.getElementById('event-selector'); if (ev) { ev.value = sel.value; ev.dispatchEvent(new Event('change')); } }
function syncInspBtns() {
  var on = typeof Timer !== 'undefined' && Timer.inspectionEnabled && Timer.inspectionEnabled();
  ['btn-inspection-toggle','insp-btn-mob'].forEach(function(id) {
    var b = document.getElementById(id);
    if (!b) return;
    b.textContent = on ? 'INSP: ON' : 'INSP: OFF';
    b.classList.toggle('btn-outline-info', on);
    b.classList.toggle('btn-outline-secondary', !on);
  });
}
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); if (typeof App !== 'undefined') App.nextScramble(); }
});

/* Retry panels */
function _retryPanels() {
  var tc = document.getElementById('trainer-content');
  if (tc && tc.children.length === 0 && typeof AlgTrainer !== 'undefined') { try { AlgTrainer.show(); } catch(e) {} }
  var ta = document.getElementById('ta-content');
  if (ta && ta.children.length === 0 && typeof TimeAttack !== 'undefined') { try { TimeAttack.show(); } catch(e) {} }
}
function _ensureScramble() {
  var el = document.getElementById('scramble-display');
  if (el && (el.textContent.trim() === 'Generating...' || el.textContent.trim() === '')) {
    if (typeof App !== 'undefined' && typeof App.nextScramble === 'function') App.nextScramble();
  }
}
document.addEventListener('DOMContentLoaded', function() { setTimeout(_ensureScramble, 100); });
window.addEventListener('load', function() {
  _ensureScramble(); setTimeout(_ensureScramble, 500); setTimeout(_ensureScramble, 1500);
  setTimeout(_retryPanels, 500); setTimeout(_retryPanels, 1500); setTimeout(_retryPanels, 3000);
});

/* SW */
function registerSW() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
</html>
