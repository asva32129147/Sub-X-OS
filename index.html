<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" id="theme-color-meta" content="#1a1a1a">
  <!-- v3 — cache bust -->
  <title>Sub-X OS</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏱</text></svg>">

  <link rel="stylesheet" href="base.css?v=13">
  <link rel="stylesheet" href="timer.css?v=13">
  <link rel="stylesheet" href="panels.css?v=13">
  <link rel="stylesheet" href="modals.css?v=13">
  <link rel="stylesheet" href="alg-trainer.css?v=13">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;600&family=Rubik:wght@300;400;600&family=Outfit:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

<!-- Hidden state element — timer.js writes data-state here AND on #timer-display -->
<div id="timer-state" data-state="idle" aria-hidden="true" style="display:none"></div>

<!-- ═══════════════════════════════════════════════════════════════════════════
     APP SHELL
     Grid: [sidebar 180px] [main 1fr] [side 220px]   (desktop)
     Mobile: flex column — sidebar hidden, mobile-bar shown
══════════════════════════════════════════════════════════════════════════════ -->
<div id="app">

  <!-- ── LEFT SIDEBAR (desktop only) ──────────────────────────────────────── -->
  <nav id="sidebar" aria-label="Navigation">

    <div class="sb-logo" aria-label="Sub-X OS">Sub-X OS</div>

    <!-- Event -->
    <div class="sb-section">
      <div class="sb-label">Event</div>
      <select id="event-selector" class="sb-select" aria-label="Select event"></select>
    </div>

    <!-- Session -->
    <div class="sb-section">
      <div class="sb-label">Session</div>
      <select id="session-selector" class="sb-select" aria-label="Select session"></select>
      <div class="sb-row">
        <button id="btn-new-session"    class="sb-btn" title="New session">+ New</button>
        <button id="btn-rename-session" class="sb-btn" title="Rename session">✎</button>
        <button id="btn-delete-session" class="sb-btn danger" title="Delete session">🗑</button>
      </div>
    </div>

    <!-- Navigation -->
    <div class="sb-section">
      <div class="sb-label">View</div>
      <button class="sb-nav active" data-view="timer"   onclick="showView('timer',this)">Timer</button>
      <button class="sb-nav"        data-view="trainer" onclick="showView('trainer',this)">Alg Trainer</button>
    </div>

    <!-- Controls (push to bottom) -->
    <div class="sb-section sb-bottom">
      <button id="btn-inspection-toggle" class="sb-ctrl insp-on"
              onclick="Timer.toggleInspection()">INSP: ON</button>
      <button class="sb-ctrl" onclick="App.nextScramble()">New Scramble</button>
      <button class="sb-ctrl" onclick="SessionManager.open()">Sessions</button>
      <button class="sb-ctrl" onclick="UniversalImport.open()">Import Data</button>
      <button class="sb-ctrl" onclick="showView('timeattack',this)">Time Attack</button>
      <button class="sb-ctrl" id="btn-smartcube" onclick="document.getElementById('smartcube-overlay').classList.toggle('open')">Smart Cube</button>
      <button class="sb-ctrl" id="btn-account" onclick="AuthUI.open()">Sign In</button>
      <button class="sb-ctrl" id="btn-settings" onclick="Settings.open()">Settings</button>
    </div>

  </nav>

  <!-- ── MOBILE TOP BAR (≤640px only) ─────────────────────────────────────── -->
  <header id="mobile-bar" role="banner">
    <button id="btn-mobile-menu" class="mob-icon-btn" onclick="openDrawer()"
            aria-label="Open menu">☰</button>
    <span class="mb-title">Sub-X OS</span>
    <select id="event-sel-mob" class="mob-sel" aria-label="Event"
            onchange="syncEventFromMob(this)"></select>
    <button id="insp-btn-mob" class="mob-insp insp-on"
            onclick="Timer.toggleInspection();syncInspBtns()">INSP</button>
    <button class="mob-icon-btn" onclick="Settings.open()" aria-label="Settings">⚙</button>
  </header>

  <!-- ── MAIN AREA ─────────────────────────────────────────────────────────── -->
  <main id="main-area" role="main">

    <!-- ── TIMER VIEW ────────────────────────────────────────────────────── -->
    <div id="view-timer" class="view active">

      <!-- Scramble at very top -->
      <div id="scramble-wrap" role="region" aria-label="Scramble">
        <div id="scramble-event-label" style="display:none"></div>
        <div id="scramble-display" aria-live="polite">Generating...</div>
        <button class="scr-btn" onclick="App.nextScramble()"
                title="New scramble (N)" aria-label="New scramble">↺</button>
      </div>

      <!-- PB flash badge -->
      <div id="pb-flash" role="status" aria-live="polite">🏆 NEW PB!</div>

      <!-- Timer centre — this entire area is the tap target -->
      <div id="timer-area" role="button" aria-label="Timer — tap or hold Space">
        <div id="timer-display" data-state="idle" aria-live="off">0.00</div>
        <div id="inspection-display" aria-live="assertive"></div>
      </div>

      <!-- Hint at bottom of main -->
      <div id="timer-hint" aria-hidden="true">
        Hold <kbd>Space</kbd> to start &nbsp;·&nbsp; <kbd>Esc</kbd> cancel
      </div>

      <!-- Stat detail popup -->
      <div id="stat-detail-overlay" role="dialog" aria-hidden="true"></div>

    </div><!-- /view-timer -->

    <!-- ── TRAINER VIEW ──────────────────────────────────────────────────── -->
    <div id="view-trainer" class="view">
      <div id="trainer-panel">
        <div id="trainer-content"><!-- Populated by AlgTrainer.init() --></div>
      </div>
    </div><!-- /view-trainer -->

    <!-- ── TIME ATTACK VIEW ─────────────────────────────────────────────── -->
    <div id="view-timeattack" class="view">
      <div id="time-attack-panel" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0"><div id="ta-content"></div></div>
    </div>

  </main><!-- /main-area -->

  <!-- ── RIGHT PANEL (stats + solves) ─────────────────────────────────────── -->
  <aside id="side" aria-label="Statistics and solve list">
    <div id="stats-panel" role="region" aria-label="Statistics"></div>
    <div id="solve-panel">
      <div class="solve-panel-header">
        <span>Solves</span>
        <button class="btn-sm" onclick="Sessions.exportCSTimer()">Export</button>
      </div>
      <div id="solve-list" role="list"></div>
    </div>
    <div id="session-controls">
      <button onclick="document.getElementById('btn-new-session').click()">New</button>
      <button onclick="document.getElementById('btn-rename-session').click()">Rename</button>
      <button style="color:var(--red)"
              onclick="document.getElementById('btn-delete-session').click()">Delete</button>
    </div>
  </aside>

</div><!-- /app -->

<!-- ── MOBILE DRAWER (slides in from left on mobile) ───────────────────────── -->
<div id="drawer-overlay" onclick="closeDrawer()" aria-hidden="true"></div>
<div id="mobile-drawer" role="navigation" aria-label="Mobile navigation">
  <div class="sb-logo">Sub-X OS</div>

  <div class="sb-section">
    <div class="sb-label">Event</div>
    <select id="event-sel-drawer" class="sb-select"
            onchange="syncEventFromDrawer(this)"></select>
  </div>

  <div class="sb-section">
    <div class="sb-label">Session</div>
    <select id="sess-sel-drawer" class="sb-select"
            onchange="Storage.setCurrentSession(this.value);App.onSessionSwitch();closeDrawer()"></select>
    <div class="sb-row">
      <button onclick="document.getElementById('btn-new-session').click();closeDrawer()"
              class="sb-btn">+ New</button>
      <button onclick="document.getElementById('btn-rename-session').click();closeDrawer()"
              class="sb-btn">✎</button>
      <button onclick="document.getElementById('btn-delete-session').click();closeDrawer()"
              class="sb-btn danger">🗑</button>
    </div>
  </div>

  <div class="sb-section">
    <div class="sb-label">View</div>
    <button class="sb-nav" onclick="showView('timer',null);closeDrawer()">Timer</button>
    <button class="sb-nav" onclick="showView('trainer',null);closeDrawer()">Alg Trainer</button>
  </div>

  <div class="sb-section">
    <button class="sb-ctrl" onclick="SessionManager.open();closeDrawer()">Sessions</button>
    <button class="sb-ctrl" onclick="UniversalImport.open();closeDrawer()">Import Data</button>
    <button class="sb-ctrl" onclick="showView('timeattack',null);closeDrawer()">Time Attack</button>
    <button class="sb-ctrl" onclick="Timer.toggleInspection();syncInspBtns();closeDrawer()">
      Toggle Inspection</button>
    <button class="sb-ctrl" onclick="Settings.open();closeDrawer()">Settings</button>
  </div>
</div>

<!-- ── SETTINGS MODAL ─────────────────────────────────────────────────────── -->
<div id="settings-overlay" class="modal-overlay" role="dialog" aria-modal="true"
     aria-label="Settings">
  <div class="modal-box">
    <div class="modal-header">
      <h2>Settings</h2>
      <button id="settings-close" aria-label="Close settings">✕</button>
    </div>
    <div id="settings-content"></div>
  </div>
</div>

<!-- ── SESSION MANAGER MODAL ─────────────────────────────────────────────── -->
<!-- SessionManager.open() creates its modal dynamically -->

<!-- ── UNIVERSAL IMPORT MODAL ─────────────────────────────────────────────── -->
<!-- UniversalImport.open() creates its modal dynamically -->

<!-- ── SOLVE SUMMARY MODAL ─────────────────────────────────────────────────── -->
<div id="solve-summary-overlay" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-box" style="max-width:520px">
    <div class="modal-header">
      <h2>Solve Detail</h2>
      <button onclick="SolveSummary.close()" aria-label="Close">✕</button>
    </div>
    <div id="solve-summary-content"></div>
  </div>
</div>
<div id="ss-toast" class="ss-toast" aria-live="polite"></div>

<!-- ── SMART CUBE PANEL (sidebar section) ──────────────────────────────────── -->
<div id="smartcube-overlay" class="modal-overlay" role="dialog">
  <div class="modal-box" style="max-width:480px">
    <div class="modal-header">
      <h2>Smart Cube</h2>
      <button onclick="document.getElementById('smartcube-overlay').classList.remove('open')" aria-label="Close">✕</button>
    </div>
    <div id="smartcube-panel">
      <div id="smartcube-status" data-state="idle" class="sc-status">
        No cube connected
      </div>
      <div class="sc-actions">
        <button id="btn-smartcube-connect" class="btn-primary" style="margin-right:6px" onclick="SmartCube.connect()">
          Connect Cube
        </button>
        <button id="btn-smartcube-disconnect" style="display:none" class="btn-sm" onclick="SmartCube.disconnect()">Disconnect</button>
        <button id="btn-gyro-toggle" class="btn-sm" onclick="Gyro.toggle()" title="Phone gyro">
          Gyro
        </button>
        <button id="btn-gyro-reset" class="btn-sm" onclick="Gyro.reset()" title="Reset gyro calibration">
          Reset
        </button>
      </div>
      <!-- Gyro visual -->
      <div id="gyro-panel" style="display:none">
        <div class="sc-section-label">Gyro Orientation</div>
        <div id="gyro-cube-wrap">
          <div id="gyro-cube">
            <div class="gc-face gc-front">F</div>
            <div class="gc-face gc-back">B</div>
            <div class="gc-face gc-left">L</div>
            <div class="gc-face gc-right">R</div>
            <div class="gc-face gc-top">U</div>
            <div class="gc-face gc-bottom">D</div>
          </div>
        </div>
        <div class="sc-gyro-vals" id="gyro-vals">α:— β:— γ:—</div>
        <div class="sc-section-label" style="margin-top:8px">Drag to calibrate zero point</div>
        <div id="gyro-cal-bar" title="Drag to offset calibration">
          <div id="gyro-cal-thumb"></div>
        </div>
      </div>
      <!-- Live move display -->
      <div class="sc-section-label" id="sc-move-label" style="display:none">Live Moves</div>
      <div id="smartcube-moves" class="sc-moves"></div>
      <!-- Cube type info -->
      <div id="sc-info" class="sc-info"></div>
    </div>
  </div>
</div>

<!-- ── MOBILE BOTTOM TAB BAR ─────────────────────────────────────────────── -->
<div id="mobile-tabs" role="tablist" aria-label="Navigation tabs">
  <button class="mob-tab active" role="tab" aria-selected="true"
          onclick="mobileTab('timer',this)">
    <span>Timer</span>
  </button>
  <button class="mob-tab" role="tab" aria-selected="false"
          onclick="mobileTab('stats',this)">
    <span>Stats</span>
  </button>
  <button class="mob-tab" role="tab" aria-selected="false"
          onclick="mobileTab('trainer',this)">
    <span>Trainer</span>
  </button>
  <button class="mob-tab" role="tab" aria-selected="false"
          onclick="mobileTab('timeattack',this)">
    <span>Attack</span>
  </button>
  <button class="mob-tab" role="tab" aria-selected="false"
          onclick="Settings.open()">
    <span>Settings</span>
  </button>
</div>

<!-- Hidden file input for csTimer import -->
<input type="file" id="import-file-input" accept=".txt,.json"
       aria-hidden="true" style="display:none"
       onchange="Sessions.importCSTimer(this.files[0])">

<!-- ═══════════════════════════════════════════════════════════════════════════
     JS — LOAD ORDER IS CRITICAL (dependencies first, app.js last)
     utils.js    → no deps
     storage.js  → utils
     scramble.js → none
     timer.js    → utils, storage
     sessions.js → utils, storage
     stats.js    → utils, storage
     settings.js → storage, scramble, timer
     alg-data.js → none
     alg-trainer.js → utils, storage, alg-data
     app.js      → everything (loaded last)
══════════════════════════════════════════════════════════════════════════════ -->
<!-- Supabase JS SDK — required for cloud sync + auth -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="utils.js?v=13"></script>
<script src="storage.js?v=13"></script>
<script src="scramble.js?v=13"></script>
<script src="timer.js?v=13"></script>
<script src="sessions.js?v=13"></script>
<script src="stats.js?v=13"></script>
<script src="settings.js?v=13"></script>
<script src="alg-data.js?v=13"></script>
<script src="alg-trainer.js?v=13"></script>
<script src="solve-summary.js?v=13"></script>
<script src="smartcube.js?v=13"></script>
<script src="gyro.js?v=13"></script>
<script src="session-manager.js?v=13"></script>
<script src="universal-import.js?v=13"></script>
<script src="time-attack.js?v=13"></script>
<script src="cloud-sync.js?v=13"></script>
<script src="auth-ui.js?v=13"></script>
<script src="app.js?v=13"></script>

<script>
// ── View switching ────────────────────────────────────────────────────────────
function showView(name, btn) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.sb-nav, .mob-tab[data-view]').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name)?.classList.add('active');
  // Highlight matching nav buttons
  document.querySelectorAll('[data-view="' + name + '"]').forEach(b => b.classList.add('active'));
  if (btn) btn.classList.add('active');
  if (name === 'trainer') { AlgTrainer.show(); Timer.cancelAll(); }
  else AlgTrainer.hide();
  if (name === 'timeattack') { TimeAttack.show(); Timer.cancelAll(); }
}

// ── Mobile drawer ─────────────────────────────────────────────────────────────
function openDrawer() {
  document.getElementById('mobile-drawer').classList.add('open');
  document.getElementById('drawer-overlay').classList.add('open');
  // Sync selectors
  const evD = document.getElementById('event-sel-drawer');
  const seD = document.getElementById('sess-sel-drawer');
  const evM = document.getElementById('event-selector');
  const seM = document.getElementById('session-selector');
  if (evD && evM) { evD.innerHTML = evM.innerHTML; evD.value = evM.value; }
  if (seD && seM) { seD.innerHTML = seM.innerHTML; seD.value = seM.value; }
}
function closeDrawer() {
  document.getElementById('mobile-drawer').classList.remove('open');
  document.getElementById('drawer-overlay').classList.remove('open');
}

// ── Mobile event sync ─────────────────────────────────────────────────────────
function syncEventFromMob(sel) {
  const main = document.getElementById('event-selector');
  if (main) { main.value = sel.value; main.dispatchEvent(new Event('change')); }
}
function syncEventFromDrawer(sel) {
  const main = document.getElementById('event-selector');
  if (main) { main.value = sel.value; main.dispatchEvent(new Event('change')); }
  const mob = document.getElementById('event-sel-mob');
  if (mob) mob.value = sel.value;
}

// ── Inspection button sync ────────────────────────────────────────────────────
function syncInspBtns() {
  const s = Storage.getSettings();
  const mode = s.inspectionMode || (s.inspection ? 'always' : 'off');
  const on = mode !== 'off';
  const labels = { always:'INSP: ON', 'except-bld':'INSP: -BLD', updown:'INSP: ↑↓', off:'INSP: OFF' };
  const mob_labels = { always:'INSP✓', 'except-bld':'-BLD', updown:'↑↓', off:'INSP' };
  const mainBtn = document.getElementById('btn-inspection-toggle');
  const mobBtn  = document.getElementById('insp-btn-mob');
  if (mainBtn) { mainBtn.textContent = labels[mode]||'INSP'; mainBtn.classList.toggle('insp-on', on); }
  if (mobBtn)  { mobBtn.textContent  = mob_labels[mode]||'INSP'; mobBtn.classList.toggle('insp-on', on); }
}

// ── Mobile tabs ───────────────────────────────────────────────────────────────
function mobileTab(name, btn) {
  document.querySelectorAll('.mob-tab').forEach(b => {
    b.classList.remove('active');
    b.setAttribute('aria-selected','false');
  });
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  if (name === 'stats') {
    // Toggle stats bottom sheet
    const side = document.getElementById('side');
    const wasOpen = side.classList.contains('open');
    side.classList.toggle('open', !wasOpen);
    showView('timer', null);
  } else {
    document.getElementById('side').classList.remove('open');
    showView(name, null);
  }
}

// ── Keep mobile event selector in sync ────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const mainEv = document.getElementById('event-selector');
  const mobEv  = document.getElementById('event-sel-mob');
  if (mainEv && mobEv) {
    mobEv.innerHTML = mainEv.innerHTML;
    mobEv.value     = mainEv.value;
    mainEv.addEventListener('change', () => { mobEv.value = mainEv.value; });
  }
});

// ── Keyboard shortcuts ────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT'
      || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
  if (e.code === 'KeyN' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); App.nextScramble(); }
  if (e.code === 'Escape') { Settings.close(); closeDrawer(); }
});

// ── Register service worker ───────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  // Unregister any stale service workers first, then register fresh
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  }).finally(() => {
    navigator.serviceWorker.register('./sw.js')
      .catch(e => console.warn('SW:', e));
  });
}
</script>
</body>
</html>
